services:

  # ==========================================================
  # NESTJS API
  # ==========================================================
  - type: web
    name: antara-api
    runtime: docker
    plan: free

    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .

    # --------------------------------------------------------
    # HEALTH CHECK
    # --------------------------------------------------------
    healthCheckPath: /health

    envVars:

      # ------------------------------------------------------
      # DATABASE
      # Neon PostgreSQL pooled connection string
      # ------------------------------------------------------
      - key: DATABASE_URL
        sync: false


      # ------------------------------------------------------
      # REDIS
      # Upstash Redis TLS URL
      # ------------------------------------------------------
      - key: REDIS_URL
        sync: false


      # ------------------------------------------------------
      # JWT AUTH
      # ------------------------------------------------------
      - key: JWT_ACCESS_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true


      # ------------------------------------------------------
      # FRONTEND / CORS
      #
      # Initial Render frontend URL
      # Later:
      # https://erp.project-antara.space
      # ------------------------------------------------------
      - key: FRONTEND_URL
        value: https://antara-web.onrender.com


      # ------------------------------------------------------
      # NODE ENVIRONMENT
      # ------------------------------------------------------
      - key: NODE_ENV
        value: production


      # ------------------------------------------------------
      # OPENAI
      # Optional
      # ------------------------------------------------------
      - key: OPENAI_API_KEY
        sync: false

      - key: OPENAI_MODEL
        value: gpt-5-mini


      # ------------------------------------------------------
      # GOOGLE SERVICE ACCOUNT
      # Optional Calendar / Drive integrations
      # ------------------------------------------------------
      - key: GOOGLE_PROJECT_ID
        sync: false

      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false

      - key: GOOGLE_PRIVATE_KEY
        sync: false

      - key: GOOGLE_CALENDAR_ID
        sync: false

      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        sync: false


      # ------------------------------------------------------
      # EMAIL / NOTIFICATIONS
      # ------------------------------------------------------
      - key: RESEND_API_KEY
        sync: false

      - key: NOTIFICATIONS_EMAIL_ENABLED
        value: "false"

      - key: NOTIFICATIONS_FROM_EMAIL
        sync: false



  # ==========================================================
  # NEXT.JS FRONTEND
  # ==========================================================
  - type: web
    name: antara-web
    runtime: docker
    plan: free

    dockerfilePath: ./infra/docker/web.Dockerfile
    dockerContext: .

    envVars:

      # ------------------------------------------------------
      # NODE ENVIRONMENT
      # ------------------------------------------------------
      - key: NODE_ENV
        value: production


      # ------------------------------------------------------
      # API URL
      #
      # Initial Render backend URL
      # Later:
      # https://api.erp.project-antara.space/api
      # ------------------------------------------------------
      - key: NEXT_PUBLIC_API_URL
        value: https://antara-api.onrender.com/api

      - key: API_URL
        value: https://antara-api.onrender.com/api


      # ------------------------------------------------------
      # NEXTAUTH / AUTH.JS
      #
      # Initial Render frontend URL
      # Later:
      # https://erp.project-antara.space
      # ------------------------------------------------------
      - key: NEXTAUTH_URL
        value: https://antara-web.onrender.com

      - key: NEXTAUTH_SECRET
        generateValue: true


      # ------------------------------------------------------
      # GOOGLE OAUTH
      #
      # Initial callback:
      # https://antara-web.onrender.com/api/auth/callback/google
      #
      # Later:
      # https://erp.project-antara.space/api/auth/callback/google
      # ------------------------------------------------------
      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false


      # ------------------------------------------------------
      # ALLOWED GOOGLE EMAILS
      #
      # Example:
      # user1@goa.bits-pilani.ac.in,user2@goa.bits-pilani.ac.in
      # ------------------------------------------------------
      - key: GOOGLE_ALLOWED_EMAILS
        sync: false