services:

  - type: web
    name: antara-api
    runtime: docker
    plan: free

    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .

    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        sync: false

      - key: JWT_ACCESS_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: FRONTEND_URL
        value: https://antara-web.onrender.com

      - key: NODE_ENV
        value: production

      - key: OPENAI_API_KEY
        sync: false

      - key: OPENAI_MODEL
        value: gpt-5-mini

      - key: GOOGLE_PROJECT_ID
        sync: false

      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false

      - key: GOOGLE_PRIVATE_KEY
        sync: false

      - key: GOOGLE_CALENDAR_ID
        sync: false

      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        sync: false

      - key: RESEND_API_KEY
        sync: false

      - key: NOTIFICATIONS_EMAIL_ENABLED
        value: "false"

      - key: NOTIFICATIONS_FROM_EMAIL
        sync: false


  - type: web
    name: antara-web
    runtime: docker
    plan: free

    dockerfilePath: ./infra/docker/web.Dockerfile
    dockerContext: .

    envVars:
      - key: NODE_ENV
        value: production

      - key: NEXT_PUBLIC_API_URL
        value: https://antara-api.onrender.com/api

      - key: API_URL
        value: https://antara-api.onrender.com/api

      - key: NEXTAUTH_URL
        value: https://antara-web.onrender.com

      - key: NEXTAUTH_SECRET
        generateValue: true

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: GOOGLE_ALLOWED_EMAILS
        sync: false