services:
  - type: web
    name: antara-api
    runtime: docker
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: antara-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: antara-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://antara-web.onrender.com
      - key: NOTIFICATIONS_EMAIL_ENABLED
        value: "false"
    preDeployCommand: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

  - type: web
    name: antara-web
    runtime: docker
    dockerfilePath: ./infra/docker/web.Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://antara-api.onrender.com/api
      - key: API_URL
        value: https://antara-api.onrender.com/api
      - key: NEXTAUTH_URL
        value: https://antara-web.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true

  - type: redis
    name: antara-redis
    plan: starter
    ipAllowList: []

databases:
  - name: antara-postgres
    plan: starter