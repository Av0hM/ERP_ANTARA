services:
  - type: web
    name: antara-api
    runtime: docker
    plan: free

    autoDeployTrigger: off

    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .

    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 240

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: DIRECT_URL
        sync: false

      - key: REDIS_URL
        sync: false

      - key: JWT_ACCESS_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: FRONTEND_URL
        value: https://erp.project-antara.space

      - key: NODE_ENV
        value: production

      - key: AI_ENABLED
        value: "false"

      - key: STORAGE_DRIVE_ENABLED
        value: "false"

      - key: STORAGE_S3_ENABLED
        value: "false"

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_ALLOWED_EMAILS
        sync: false

      - key: GOOGLE_PROJECT_ID
        sync: false

      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false

      - key: GOOGLE_PRIVATE_KEY
        sync: false

      - key: GOOGLE_CALENDAR_ID
        sync: false

      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        sync: false

      - key: RESEND_API_KEY
        sync: false

      - key: NOTIFICATIONS_EMAIL_ENABLED
        value: "false"

      - key: NOTIFICATIONS_FROM_EMAIL
        sync: false

  - type: web
    name: antara-web
    autoDeployTrigger: off
    runtime: docker
    plan: free

    dockerfilePath: ./infra/docker/web.Dockerfile
    dockerContext: .

    envVars:
      - key: NODE_ENV
        value: production

      - key: NEXT_PUBLIC_API_URL
        value: https://antara-api-ev5f.onrender.com/api

      - key: API_URL
        value: https://antara-api-ev5f.onrender.com/api

      - key: NEXTAUTH_URL
        value: https://erp.project-antara.space

      - key: NEXTAUTH_SECRET
        generateValue: true

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: GOOGLE_ALLOWED_EMAILS
        sync: false
